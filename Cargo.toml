[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shinaoka/sphaira-rs"
publish = false

[workspace.dependencies]
sphaira-comm = { path = "crates/sphaira-comm" }
sphaira-atomdata = { path = "crates/sphaira-atomdata" }
sphaira-structure = { path = "crates/sphaira-structure" }
sphaira-blocks = { path = "crates/sphaira-blocks" }
sphaira-twocenter = { path = "crates/sphaira-twocenter" }
sphaira-grid = { path = "crates/sphaira-grid" }
sphaira-scf = { path = "crates/sphaira-scf" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

# No default profile carries debug info (REPOSITORY_RULES.md, "Build profiles").
[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
debug = 0

[profile.bench]
debug = 0

# Comprehensive CI runs.
[profile.ci]
inherits = "test"
debug = 0
incremental = false
strip = "symbols"

# Opt-in profile for debugger sessions and readable backtraces.
[profile.release-debug]
inherits = "release"
debug = 2
