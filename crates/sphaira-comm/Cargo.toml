[package]
name = "sphaira-comm"
description = "Communicator trait with single-rank, in-process simulated and MPI implementations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
# Real MPI communicator (`MpiComm`) over rsmpi-rt, runtime-loaded MPI (no headers needed).
mpi = ["dep:mpi", "mpi/mpi-rt-sys-backend"]

[dependencies]
num-complex = { version = "0.4", features = ["bytemuck"] }
bytemuck = "1"
mpi = { package = "rsmpi-rt", version = "0.8.2", default-features = false, optional = true }

[[example]]
name = "mpi_check"
required-features = ["mpi"]
